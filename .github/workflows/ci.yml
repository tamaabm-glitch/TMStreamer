name: CI

on:
  push:
    branches: [main, tm-lic-v1.2-integration]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - mise.toml
              - .github/workflows/ci.yml
            backend:
              - *shared
              - device/backend/**
              # The tests read the signing key and the install script
              - device/packaging/**
            frontend:
              - *shared
              - device/frontend/**

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # The same kind of CPU as the Raspberry Pi it ships on
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install GStreamer headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libglib2.0-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgstrtspserver-1.0-dev
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: device/backend
      # The web interface is compiled into the backend, so its folder has to
      # exist; what's in it is the frontend job's business
      - run: mkdir -p device/frontend/dist
      - name: Check formatting of changed Rust modules
        run: |
          rustfmt --edition 2024 --check \
            device/backend/src/system/update.rs \
            device/backend/src/input.rs \
            device/backend/src/output/recording.rs \
            device/backend/src/output/recording.test.rs \
            device/backend/src/web.rs
      - run: mise run backend:lint
      - run: mise run backend:test
      - name: Test offline release signing and manifest validation
        run: sh device/packaging/tests/security.sh

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run frontend:install
      - name: Check formatting of update card
        run: pnpm exec prettier --check src/components/system/UpdateCard.svelte
        working-directory: device/frontend
      - run: mise run frontend:check
      - name: Build
        run: mise run frontend:build

  package:
    name: Debian ARM64 package
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install GStreamer headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libglib2.0-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgstrtspserver-1.0-dev
      - uses: jdx/mise-action@v5
      - name: Install frontend dependencies
        run: mise run frontend:install
      - name: Build Debian ARM64 package
        run: mise run device:package
      - name: Audit Debian package and maintainer scripts
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find device/backend/target/debian -maxdepth 1 -type f -name 'tmstreamer_*_arm64.deb' -print -quit)"
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "tmstreamer"
          test "$(dpkg-deb -f "$deb" Architecture)" = "arm64"
          control="$(mktemp -d)"
          trap 'rm -rf "$control"' EXIT
          dpkg-deb --contents "$deb" > "$control/contents"
          grep -Fq "usr/bin/tmstreamer" "$control/contents"
          grep -Fq "usr/lib/systemd/system/tmstreamer.service" "$control/contents"
          dpkg-deb --control "$deb" "$control"
          for script in postinst prerm postrm; do
            test -x "$control/$script"
            if grep -Eq 'systemctl[[:space:]]+(enable|start)|deb-systemd-invoke[[:space:]]+(enable|start)' "$control/$script"; then
              echo "Unsafe automatic service activation found in $script" >&2
              exit 1
            fi
          done
          echo "PASS: ARM64 package identity, executable, service unit, maintainer-script permissions and passive install lifecycle"
