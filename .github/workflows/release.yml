name: Legacy release pipeline (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    name: Refuse legacy YStreamer release process
    runs-on: ubuntu-24.04
    steps:
      - name: Explain why this pipeline is disabled
        run: |
          echo "::error::The legacy release workflow used the upstream YStreamer signing key and release process."
          echo "::error::Use only the TMStreamer offline Ed25519 signing procedure documented in device/packaging/TMSTREAMER_SIGNED_UPDATES.md."
          echo "::error::No package, image, tag, or GitHub Release was created."
          exit 1
