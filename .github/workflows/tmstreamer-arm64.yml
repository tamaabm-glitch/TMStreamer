 
name: TMStreamer Debian 12 ARM64 Build

on:
  push:
    branches:
      - tmstreamer
      - tm-lic-v1.2-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tmstreamer-debian12-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debian 12 ARM64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout TMStreamer source
        uses: actions/checkout@v7

      - name: Build inside Debian 12 ARM64
        shell: bash
        run: |
          docker run --rm \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/workspace \
            --workdir /workspace \
            debian:12 \
            bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive

              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                ca-certificates \
                curl \
                pkg-config \
                dpkg-dev \
                libglib2.0-dev \
                libgstreamer1.0-dev \
                libgstreamer-plugins-base1.0-dev \
                libgstrtspserver-1.0-dev \
                libdrm-dev \
                libudev-dev \
                libusb-1.0-0-dev

              curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
              apt-get install -y nodejs
              npm install --global pnpm@12.4.2

              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- \
                -y --profile minimal \
                --default-toolchain 1.95.0 \
                --component rustfmt,clippy

              export PATH="/root/.cargo/bin:$PATH"

              cargo install cargo-deb --version 3.8.0 --locked

              cd device/frontend
              pnpm install --frozen-lockfile
              pnpm build

              cd ../backend
              cargo deb
            '

      - name: Verify Debian ARM64 package
        shell: bash
        run: |
          set -euo pipefail

          DEB="$(find device/backend/target/debian \
            -maxdepth 1 -type f -name "tmstreamer_*.deb" -print -quit)"

          if [ -z "$DEB" ]; then
            echo "::error::TMStreamer Debian package was not generated."
            exit 1
          fi

          ARCH="$(dpkg-deb -f "$DEB" Architecture)"
          PACKAGE="$(dpkg-deb -f "$DEB" Package)"
          VERSION="$(dpkg-deb -f "$DEB" Version)"
          DEPENDS="$(dpkg-deb -f "$DEB" Depends)"
          MAINTAINER="$(dpkg-deb -f "$DEB" Maintainer)"
          RECOMMENDS="$(dpkg-deb -f "$DEB" Recommends)"

          echo "Package: $PACKAGE"
          echo "Version: $VERSION"
          echo "Architecture: $ARCH"
          echo "Dependencies: $DEPENDS"

          if [ "$PACKAGE" != "tmstreamer" ]; then
            echo "::error::Expected package name tmstreamer."
            exit 1
          fi

          if [ "$ARCH" != "arm64" ]; then
            echo "::error::Expected ARM64 package."
            exit 1
          fi

          if ! printf "%s" "$MAINTAINER" | grep -q "^TMStreamer Project "; then
            echo "::error::Unexpected package maintainer: $MAINTAINER"
            exit 1
          fi

          if printf "%s" "$RECOMMENDS" | grep -qi "raspi"; then
            echo "::error::Raspberry Pi-only recommendation found in the Radxa package."
            exit 1
          fi

          if echo "$DEPENDS" | grep -q "libglib2.0-0t64"; then
            echo "::error::Incompatible t64 dependency detected."
            exit 1
          fi

          dpkg-deb --contents "$DEB" | tee package-contents.txt
          grep -Eq "\\./(usr/)?lib/systemd/system/tmstreamer\\.service" package-contents.txt

          ROOT="$(mktemp -d)"
          CONTROL="$(mktemp -d)"
          trap 'rm -rf "$ROOT" "$CONTROL"' EXIT
          dpkg-deb -x "$DEB" "$ROOT"
          dpkg-deb -e "$DEB" "$CONTROL"

          test -x "$ROOT/usr/bin/tmstreamer"
          test ! -e "$ROOT/usr/bin/ystreamer"
          SERVICE="$ROOT/usr/lib/systemd/system/tmstreamer.service"
          if [ ! -f "$SERVICE" ]; then SERVICE="$ROOT/lib/systemd/system/tmstreamer.service"; fi
          grep -Fqx "ExecStart=/usr/bin/tmstreamer run" "$SERVICE"
          grep -Fqx "ConfigurationDirectory=tmstreamer" "$SERVICE"
          grep -Fqx "StateDirectory=tmstreamer" "$SERVICE"
          test -f "$ROOT/usr/share/tmstreamer/config.txt"

          if grep -Eq "boot/firmware|raspi-config|systemctl[[:space:]]+(start|restart)" "$CONTROL/postinst"; then
            echo "::error::Package postinst mutates boot settings or starts/restarts services."
            exit 1
          fi
          if grep -Eq "boot/firmware|raspi-config" "$CONTROL/postrm"; then
            echo "::error::Package postrm mutates boot settings."
            exit 1
          fi
          echo "Verified TMStreamer binary, service, paths and non-invasive package scripts."

      - name: Upload TMStreamer Debian 12 ARM64
        uses: actions/upload-artifact@v4
        with:
          name: TMStreamer-Debian12-ARM64
          path: device/backend/target/debian/tmstreamer_*.deb
          if-no-files-found: error
          retention-days: 14
