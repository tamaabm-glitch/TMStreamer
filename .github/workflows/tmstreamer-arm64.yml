name: TMStreamer ARM64 Build

on:
  push:
    branches:
      - tmstreamer
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tmstreamer-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debian ARM64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout TMStreamer source
        uses: actions/checkout@v7

      - name: Install GStreamer build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstrtspserver-1.0-dev

      - name: Install Rust, Node.js and build tools
        uses: jdx/mise-action@v5

      - name: Install frontend dependencies
        run: mise run frontend:install

      - name: Build TMStreamer Debian package
        run: mise run device:deb

      - name: Verify ARM64 package
        shell: bash
        run: |
          set -euo pipefail

          DEB="$(find device/backend/target/debian \
            -maxdepth 1 -type f -name '*.deb' -print -quit)"

          if [ -z "$DEB" ]; then
            echo "::error::Debian package was not generated."
            exit 1
          fi

          ARCH="$(dpkg-deb -f "$DEB" Architecture)"
          PACKAGE="$(dpkg-deb -f "$DEB" Package)"
          VERSION="$(dpkg-deb -f "$DEB" Version)"

          echo "Package: $PACKAGE"
          echo "Version: $VERSION"
          echo "Architecture: $ARCH"
          echo "File: $DEB"

          if [ "$ARCH" != "arm64" ]; then
            echo "::error::Expected ARM64 package, got $ARCH"
            exit 1
          fi

          dpkg-deb --contents "$DEB"

      - name: Upload TMStreamer ARM64 package
        uses: actions/upload-artifact@v4
        with:
          name: TMStreamer-ARM64-Debian
          path: device/backend/target/debian/*.deb
          if-no-files-found: error
          retention-days: 14
