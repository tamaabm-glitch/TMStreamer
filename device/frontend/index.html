
<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      content="#100B1D"
    />
    <meta
      name="description"
      content="TMStreamer - NEW GALIH MULTIMEDIA. DJI video streaming, HDMI output and recording."
    />
    <title>TMStreamer - NEW GALIH MULTIMEDIA</title>

    <script>
      // Apply saved theme before the first paint
      try {
        const theme = localStorage.getItem("ystreamer.theme");

        if (theme === "light") {
          document.documentElement.classList.add("light");
          document.documentElement.style.colorScheme = "light";
        } else {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch {
        document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = "dark";
      }
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
